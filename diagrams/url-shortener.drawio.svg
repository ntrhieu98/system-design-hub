<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" aria-label="URL Shortener Architecture Diagram">
  <title>URL Shortener Architecture</title>
  <desc>Diagram showing the architecture of a URL shortener system including Client, Load Balancer, API Service, Cache, Database, and Storage components.</desc>
  <rect x="10" y="10" width="780" height="580" fill="white" stroke="#333" stroke-width="2"/>
  <text x="400" y="40" font-size="16" font-family="Arial" text-anchor="middle">
    URL Shortener Architecture
  </text>
  
  <!-- Client -->
  <rect x="650" y="100" width="100" height="40" fill="#e1e4e8" stroke="#333" stroke-width="1"/>
  <text x="700" y="125" font-size="12" font-family="Arial" text-anchor="middle">Client</text>
  
  <!-- Load Balancer -->
  <rect x="530" y="100" width="120" height="40" fill="#e1e4e8" stroke="#333" stroke-width="1"/>
  <text x="590" y="125" font-size="12" font-family="Arial" text-anchor="middle">Load Balancer</text>
  
  <!-- API Service -->
  <rect x="380" y="100" width="140" height="40" fill="#e1e4e8" stroke="#333" stroke-width="1"/>
  <text x="450" y="125" font-size="12" font-family="Arial" text-anchor="middle">API Service</text>
  
  <!-- Cache -->
  <rect x="230" y="100" width="140" height="40" fill="#e1e4e8" stroke="#333" stroke-width="1"/>
  <text x="300" y="125" font-size="12" font-family="Arial" text-anchor="middle">Cache (Redis)</text>
  
  <!-- Database -->
  <rect x="80" y="100" width="140" height="40" fill="#e1e4e8" stroke="#333" stroke-width="1"/>
  <text x="130" y="125" font-size="12" font-family="Arial" text-anchor="middle">Database (MySQL)</text>
  
  <!-- Storage -->
  <rect x="20" y="200" width="100" height="40" fill="#e1e4e8" stroke="#333" stroke-width="1"/>
  <text x="70" y="225" font-size="12" font-family="Arial" text-anchor="middle">Object Storage</text>
  
  <!-- Flow arrows -->
  <line x1="420" y1="140" x2="530" y2="140" stroke="#8b5cf6" stroke-width="2"/>
  <line x1="550" y1="140" x2="380" y2="140" stroke="#8b5cf6" stroke-width="2"/>
  <line x1="250" y1="140" x2="230" y2="140" stroke="#8b5cf6" stroke-width="2"/>
  <line x1="150" y1="140" x2="80" y2="140" stroke="#8b5cf6" stroke-width="2"/>
  <line x1="150" y1="240" x2="80" y2="240" stroke="#8b5cf6" stroke-width="2"/>
</svg>
